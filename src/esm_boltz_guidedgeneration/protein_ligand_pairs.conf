# ====================
# Protein-Ligand Pairs Configuration
# ====================
# Format: PDB_ID,CHAIN_ID,SMILES,MASKING_PCT,NUM_DECODING_STEPS,NUM_SAMPLES,TIME_LIMIT
#
# Required fields:
#   - PDB_ID: Protein PDB identifier (e.g., 1RNT)
#   - CHAIN_ID: Chain identifier (e.g., A)
#   - SMILES: Ligand SMILES string
#
# Optional fields (with defaults):
#   - MASKING_PCT: Masking percentage (default: 0.4)
#   - NUM_DECODING_STEPS: Number of decoding steps (default: 32)
#   - NUM_SAMPLES: Number of samples per step (default: 10)
#   - TIME_LIMIT: SLURM time limit in HH:MM:SS format (default: 15:00:00)
# ====================

# Example entries (modify or replace with your protein-ligand pairs):

# RNase with GMP (guanosine monophosphate) - using default parameters:
1RNT,A,NC1=Nc2n(cnc2C(=O)N1)[C@@H]3O[C@H](CO)[C@@H](O)[C@H]3O[P](O)(O)=O,0.4,32,10,12:00:00

# Add more protein-ligand pairs using custom parameters:
# PDB_ID,CHAIN_ID,SMILES,MASKING_PCT,NUM_DECODING_STEPS,NUM_SAMPLES,TIME_LIMIT
1HII,A,CC(C)[C@H](NC(C)=O)C(=O)N[C@@H](Cc1ccccc1)[C@@H](O)CN(CC2CCCCC2)NC(=O)[C@@H](NC(C)=O)C(C)C,0.3,32,10,10:00:00
1DB1,A,C[C@H](CCCC(C)(C)O)[C@H]1CC[C@H]2C(/CCC[C@]12C)=C/C=C3/C[C@@H](O)C[C@H](O)C3=C,0.3,64,15,20:00:00